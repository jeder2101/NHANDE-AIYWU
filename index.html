<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tape Marangatu 3D - Guardiões da Memória Nhandewa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Motor Three.js 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Outfit:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #08140c;
            color: #f0fdf4;
            user-select: none;
            touch-action: manipulation;
            overflow: hidden;
        }

        .font-game {
            font-family: 'Fredoka', cursive;
        }

        .glass-card {
            background: rgba(18, 43, 27, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(74, 222, 128, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
        }

        .kwatia-paper {
            background: #fef3c7;
            color: #451a03;
            border: 4px solid #b45309;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .btn-touch {
            background: rgba(34, 197, 94, 0.25);
            border: 2px solid rgba(74, 222, 128, 0.4);
            backdrop-filter: blur(4px);
        }

        .btn-touch:active {
            background: rgba(34, 197, 94, 0.6);
            transform: scale(0.95);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1c1917; }
        ::-webkit-scrollbar-thumb { background: #b45309; border-radius: 4px; }
    </style>
</head>
<body class="h-screen w-screen relative">

    <!-- Interface Superior (Topo) -->
    <header class="absolute top-0 left-0 w-full px-4 py-3 flex justify-between items-center z-20 pointer-events-auto">
        <div class="glass-card px-4 py-2 rounded-xl flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-amber-600 border-2 border-amber-300 flex items-center justify-center text-amber-100 font-bold text-xl shadow-lg">
                🐢
            </div>
            <div>
                <h1 class="font-game text-lg md:text-xl font-bold bg-gradient-to-r from-amber-300 to-emerald-400 bg-clip-text text-transparent">
                    Tape Marangatu 3D
                </h1>
                <p class="text-[10px] text-emerald-300/80">O Caminho Sagrado da Língua</p>
            </div>
        </div>

        <!-- Rastreador de Fases -->
        <div class="flex items-center space-x-2">
            <div class="glass-card px-4 py-2 rounded-xl text-xs flex items-center space-x-2">
                <i class="fas fa-flag-checkered text-amber-400"></i>
                <span id="phase-indicator" class="text-amber-200 font-semibold">Fase 1: O Segredo do AWATI (Milho)</span>
            </div>
        </div>
    </header>

    <!-- Canvas 3D -->
    <div id="canvas-container" class="w-full h-full"></div>

    <!-- Botão de Ação / Interatividade -->
    <div class="absolute bottom-6 right-6 z-20 flex flex-col items-end space-y-2 pointer-events-auto">
        <button id="btn-interact" onclick="checkCurrentProximity()" class="hidden glass-card bg-amber-500 hover:bg-amber-400 text-amber-950 font-bold px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-2 text-sm border-2 border-amber-200 animate-bounce">
            <i class="fas fa-hand-pointer text-lg"></i>
            <span id="interact-label">Ler Kwatiá (A)</span>
        </button>
    </div>

    <!-- Controles Touch (D-Pad Mobile) -->
    <div id="touch-controls" class="absolute bottom-6 left-6 grid grid-cols-3 gap-2 w-36 h-36 md:hidden z-20 pointer-events-auto">
        <div></div>
        <button id="btn-up" class="btn-touch rounded-t-xl text-emerald-300 text-xl font-bold flex items-center justify-center">▲</button>
        <div></div>
        <button id="btn-left" class="btn-touch rounded-l-xl text-emerald-300 text-xl font-bold flex items-center justify-center">◄</button>
        <div class="flex items-center justify-center text-[10px] text-emerald-500 font-game">3D</div>
        <button id="btn-right" class="btn-touch rounded-r-xl text-emerald-300 text-xl font-bold flex items-center justify-center">►</button>
        <div></div>
        <button id="btn-down" class="btn-touch rounded-b-xl text-emerald-300 text-xl font-bold flex items-center justify-center">▼</button>
        <div></div>
    </div>

    <!-- Dica Teclado -->
    <div class="hidden md:flex absolute bottom-4 left-4 glass-card px-3 py-1.5 rounded-lg text-[11px] text-emerald-300/80 items-center space-x-2 z-20">
        <i class="fas fa-keyboard"></i>
        <span>Caminhe com <b>WASD</b> ou <b>Setas</b>. Pressione <b>ESPAÇO</b> para interagir!</span>
    </div>

    <!-- MODAL: Leitura da Kwatiá -->
    <div id="read-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="kwatia-paper max-w-lg w-full rounded-2xl p-6 relative max-h-[90vh] flex flex-col justify-between">
            <div class="flex justify-between items-start border-b-2 border-amber-800/30 pb-3">
                <div>
                    <span id="kwatia-letter" class="font-game text-4xl text-amber-900 font-bold">A a A a</span>
                    <h2 id="kwatia-title" class="font-game text-2xl text-amber-900">AWATI</h2>
                </div>
                <button onclick="closeModal('read-modal')" class="text-amber-900 hover:text-amber-700 text-2xl font-bold">✕</button>
            </div>

            <div class="my-4 flex-1 overflow-y-auto space-y-3 pr-1">
                <div id="kwatia-illustration" class="w-full h-36 bg-amber-100 rounded-xl border-2 border-amber-800/30 flex items-center justify-center text-6xl shadow-inner">
                    🌽
                </div>
                <div id="kwatia-text-list" class="space-y-1.5 font-semibold text-sm text-amber-950 font-serif">
                    <!-- Dinâmico -->
                </div>
            </div>

            <button onclick="openQuestionModal()" class="w-full py-3 bg-amber-800 hover:bg-amber-700 text-amber-50 font-bold rounded-xl shadow-lg flex items-center justify-center space-x-2 transition text-sm">
                <span>Responder às Perguntas do Enigma</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <!-- MODAL: Perguntas -->
    <div id="question-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="glass-card max-w-md w-full rounded-2xl p-6 border-2 border-amber-400/60 shadow-2xl">
            <div class="flex items-center space-x-3 mb-4 border-b border-emerald-500/30 pb-3">
                <div class="w-10 h-10 rounded-full bg-amber-500 flex items-center justify-center text-amber-950 font-bold text-xl">
                    ❓
                </div>
                <div>
                    <h3 class="font-game text-lg text-amber-300">Desafio do Tape Marangatu</h3>
                    <p class="text-[11px] text-emerald-300">Responda corretamente para avançar no caminho!</p>
                </div>
            </div>

            <p id="question-prompt" class="text-sm text-emerald-100 font-medium mb-4 leading-relaxed"></p>

            <div id="options-container" class="space-y-2 mb-4"></div>

            <div class="flex justify-end">
                <button onclick="closeModal('question-modal')" class="text-xs text-emerald-400 hover:text-emerald-200">
                    Voltar ao texto
                </button>
            </div>
        </div>
    </div>

    <!-- Lógica do Jogo 3D -->
    <script>
        const gameData = {
            phase1: {
                letter: "A a A a",
                title: "AWATI",
                icon: "🌽",
                lines: [
                    "AWATI MORÕTI",
                    "AWATI Ũ",
                    "AWATI PARÁ",
                    "AWATI PYNTA",
                    "AWATI DJEGWÁ",
                    "AWATI MARA'ẼY"
                ],
                question: "De acordo com o caderno de campo, qual das opções representa o milho branco?",
                options: [
                    { text: "Awati Ũ", correct: false },
                    { text: "Awati Morõti", correct: true },
                    { text: "Awati Pynta", correct: false },
                    { text: "Awati Pará", correct: false }
                ]
            },
            phase2: {
                letter: "DJ dj Dj dj",
                title: "DJAGWARETE",
                icon: "🐆",
                lines: [
                    "DJAGWARETE YY REMBERÉ",
                    "DJAGWARETE IPARA PORÃ",
                    "DJAGWARETE IPOTXY ATSY",
                    "DJAGWARETE O'OKWE U'Á",
                    "DJAGWARETE KA'AGWY ETE REGWA",
                    "DJAGWARETE YYAKÁ RARÕÁ",
                    "DJAGWARETE NHANDẼ PY'Y ÃWÃ O'Á YWYRUPI"
                ],
                question: "Qual expressão descreve a Onça que pertence à verdadeira floresta (Ka'agwy Ete Regwa)?",
                options: [
                    { text: "Djagwarete Ipara Porã", correct: false },
                    { text: "Djagwarete Ka'agwy Ete Regwa", correct: true },
                    { text: "Djagwarete Yy Remberé", correct: false },
                    { text: "Djagwarete Yyaká Rarõá", correct: false }
                ]
            }
        };

        let currentPhase = 1;
        let activeInteractiveObject = null;

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a1e12);
        scene.fog = new THREE.FogExp2(0x0a1e12, 0.02);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xdcfce7, 0.7));
        const dirLight = new THREE.DirectionalLight(0xfef08a, 0.9);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Terreno e Trilha
        const terrain = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshLambertMaterial({ color: 0x166534 }));
        terrain.rotation.x = -Math.PI / 2;
        scene.add(terrain);

        const path = new THREE.Mesh(new THREE.PlaneGeometry(8, 80), new THREE.MeshLambertMaterial({ color: 0x78350f }));
        path.rotation.x = -Math.PI / 2;
        path.position.set(0, 0.02, 0);
        scene.add(path);

        // Objeto Fase 1 (Awati)
        const awatiGroup = new THREE.Group();
        const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.2, 4, 8), new THREE.MeshLambertMaterial({ color: 0x84cc16 }));
        stalk.position.y = 2;
        awatiGroup.add(stalk);
        const corn = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.2, 1.2, 8), new THREE.MeshLambertMaterial({ color: 0xfacc15 }));
        corn.position.set(0.3, 2.2, 0);
        corn.rotation.z = -0.4;
        awatiGroup.add(corn);
        const ring1 = new THREE.Mesh(new THREE.RingGeometry(1.2, 1.6, 16), new THREE.MeshBasicMaterial({ color: 0xfacc15, side: THREE.DoubleSide }));
        ring1.rotation.x = -Math.PI / 2;
        ring1.position.y = 0.05;
        awatiGroup.add(ring1);
        awatiGroup.position.set(-6, 0, 10);
        scene.add(awatiGroup);

        // Barreira
        const barrier = new THREE.Mesh(new THREE.BoxGeometry(12, 6, 0.5), new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.4 }));
        barrier.position.set(0, 3, -8);
        scene.add(barrier);

        // Objeto Fase 2 (Djagwarete)
        const jaguarGroup = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.2, 3), new THREE.MeshLambertMaterial({ color: 0xd97706 }));
        body.position.y = 1;
        jaguarGroup.add(body);
        const ring2 = new THREE.Mesh(new THREE.RingGeometry(1.5, 2.0, 16), new THREE.MeshBasicMaterial({ color: 0xf59e0b, side: THREE.DoubleSide }));
        ring2.rotation.x = -Math.PI / 2;
        ring2.position.y = 0.05;
        jaguarGroup.add(ring2);
        jaguarGroup.position.set(0, 0, -25);
        scene.add(jaguarGroup);

        // Jogador (Karumbé)
        const playerGroup = new THREE.Group();
        const shell = new THREE.Mesh(new THREE.SphereGeometry(1, 8, 8, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0xd97706 }));
        shell.position.y = 0.4;
        shell.scale.set(1, 0.7, 1.2);
        playerGroup.add(shell);
        playerGroup.position.set(0, 0, 25);
        scene.add(playerGroup);

        const keys = {};
        let touchDir = { x: 0, z: 0 };

        window.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === ' ' && activeInteractiveObject) openKwatiaModal();
        });
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        const setupTouch = (id, x, z) => {
            const btn = document.getElementById(id);
            if (!btn) return;
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); touchDir.x = x; touchDir.z = z; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); touchDir.x = 0; touchDir.z = 0; });
        };
        setupTouch('btn-up', 0, -1);
        setupTouch('btn-down', 0, 1);
        setupTouch('btn-left', -1, 0);
        setupTouch('btn-right', 1, 0);

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            const speed = 8 * clock.getDelta();
            let moveX = 0, moveZ = 0;

            if (keys['w'] || keys['arrowup']) moveZ -= 1;
            if (keys['s'] || keys['arrowdown']) moveZ += 1;
            if (keys['a'] || keys['arrowleft']) moveX -= 1;
            if (keys['d'] || keys['arrowright']) moveX += 1;

            if (touchDir.x !== 0 || touchDir.z !== 0) {
                moveX = touchDir.x;
                moveZ = touchDir.z;
            }

            if (moveX !== 0 || moveZ !== 0) {
                playerGroup.rotation.y = Math.atan2(moveX, moveZ);
                let nextZ = playerGroup.position.z + moveZ * speed;
                if (currentPhase === 1 && nextZ < -7.5) nextZ = -7.5;

                playerGroup.position.x += moveX * speed;
                playerGroup.position.z = nextZ;
            }

            camera.position.x = playerGroup.position.x;
            camera.position.y = playerGroup.position.y + 7;
            camera.position.z = playerGroup.position.z + 10;
            camera.lookAt(playerGroup.position);

            const distAwati = playerGroup.position.distanceTo(awatiGroup.position);
            const distJaguar = playerGroup.position.distanceTo(jaguarGroup.position);
            const interactBtn = document.getElementById('btn-interact');
            const interactLabel = document.getElementById('interact-label');

            if (currentPhase === 1 && distAwati < 4) {
                activeInteractiveObject = 'phase1';
                interactBtn.classList.remove('hidden');
                interactLabel.innerText = "Ler Kwatiá (A)";
            } else if (currentPhase === 2 && distJaguar < 4) {
                activeInteractiveObject = 'phase2';
                interactBtn.classList.remove('hidden');
                interactLabel.innerText = "Ler Kwatiá (DJ)";
            } else {
                activeInteractiveObject = null;
                interactBtn.classList.add('hidden');
            }

            renderer.render(scene, camera);
        }

        animate();

        function checkCurrentProximity() { if (activeInteractiveObject) openKwatiaModal(); }

        function openKwatiaModal() {
            const data = gameData[activeInteractiveObject];
            document.getElementById('kwatia-letter').innerText = data.letter;
            document.getElementById('kwatia-title').innerText = data.title;
            document.getElementById('kwatia-illustration').innerText = data.icon;

            const listContainer = document.getElementById('kwatia-text-list');
            listContainer.innerHTML = '';
            data.lines.forEach(line => {
                const p = document.createElement('p');
                p.className = "border-b border-amber-800/10 pb-0.5";
                p.innerText = line;
                listContainer.appendChild(p);
            });
            openModal('read-modal');
        }

        function openQuestionModal() {
            closeModal('read-modal');
            const data = gameData[activeInteractiveObject];
            document.getElementById('question-prompt').innerText = data.question;

            const optionsBox = document.getElementById('options-container');
            optionsBox.innerHTML = '';
            data.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "w-full py-3 px-4 bg-emerald-900/85 hover:bg-emerald-700 border border-emerald-500/40 text-emerald-100 text-xs rounded-xl font-semibold transition text-left flex justify-between items-center";
                btn.innerHTML = `<span>${opt.text}</span> <i class="fas fa-chevron-right text-emerald-400/50"></i>`;
                btn.onclick = () => answerQuestion(opt.correct);
                optionsBox.appendChild(btn);
            });
            openModal('question-modal');
        }

        function answerQuestion(isCorrect) {
            if (isCorrect) {
                if (currentPhase === 1) {
                    alert("✨ AGUYJEVETE! Resposta Correta!\n\nPassagem desbloqueada no Tape Marangatu!");
                    currentPhase = 2;
                    barrier.visible = false;
                    document.getElementById('phase-indicator').innerText = "Fase 2: O Desafio do DJAGWARETE";
                } else if (currentPhase === 2) {
                    alert("🎉 PARABÉNS! Concluíste o Tape Marangatu com sucesso!");
                }
                closeModal('question-modal');
            } else {
                alert("Nhananderõ! Tenta novamente.");
            }
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
